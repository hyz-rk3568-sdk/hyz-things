name: web refactor driver

on:
  push:
    branches:
      - refactor/web-frontend-structure
    paths:
      - "apps/rust/things/src/web/**"
      - "apps/rust/things/tools/web-refactor*.py"
      - ".github/workflows/web-refactor-driver.yml"

permissions:
  contents: write

concurrency:
  group: web-refactor-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[web-refactor-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-frontend-structure
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Run refactor drivers
        run: |
          python3 apps/rust/things/tools/web-refactor.py
          python3 apps/rust/things/tools/web-refactor-pages.py
          python3 apps/rust/things/tools/web-refactor-navigation.py
          python3 apps/rust/things/tools/web-refactor-app.py
      - name: Update refactor static contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()
          old = '''\tgrep -q 'portal-camera-tab' "$(THINGS_APP)/src/web/main.rs"\n\tgrep -q '免登录实时查看摄像头画面' "$(THINGS_APP)/src/web/main.rs"'''
          new = '''\tgrep -q 'app-camera-tab' "$(THINGS_APP)/src/web/app.rs"\n\tgrep -q '\\[function_component(CameraLiveView)\\]' "$(THINGS_APP)/src/web/pages/camera.rs"'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected legacy or refactored camera static contract not found")
          PY
      - name: Format changed Rust
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
      - name: Check generated WASM frontend
        run: cargo check --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web --target wasm32-unknown-unknown
      - name: Show diff summary
        run: |
          git diff --check
          git diff --stat
      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile apps/rust/things/src/web apps/rust/things/tools/web-refactor*.py
          git commit -m "refactor(web): update generated structure contracts [web-refactor-generated]"
          git push origin HEAD:refactor/web-frontend-structure
