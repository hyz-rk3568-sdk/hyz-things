name: web refactor driver

on:
  push:
    branches:
      - refactor/web-frontend-structure
    paths:
      - "apps/rust/things/src/web/**"
      - "apps/rust/things/tools/web-refactor*.py"
      - ".github/workflows/web-refactor-driver.yml"

permissions:
  contents: write

concurrency:
  group: web-refactor-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[web-refactor-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-frontend-structure
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Update refactor static contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          legacy_camera = '''\tgrep -q 'portal-camera-tab' "$(THINGS_APP)/src/web/main.rs"\n\tgrep -q '免登录实时查看摄像头画面' "$(THINGS_APP)/src/web/main.rs"'''
          refactored_camera = '''\tgrep -q 'app-camera-tab' "$(THINGS_APP)/src/web/app.rs"\n\tgrep -q '\\[function_component(CameraLiveView)\\]' "$(THINGS_APP)/src/web/pages/camera.rs"'''
          if legacy_camera in text:
              text = text.replace(legacy_camera, refactored_camera, 1)
          elif refactored_camera not in text:
              raise SystemExit("expected legacy or refactored camera static contract not found")

          display_sdk = '''\tgrep -q 'default-brightness-level = <0>' sdk/kernel/arch/arm64/boot/dts/rockchip/rk3568-atk-evb1-mipi-dsi-1080p.dts
\t! grep -qE '&(dsi1|dsi1_panel|backlight1)[[:space:]]*\\{[[:space:]]*status = "disabled"' sdk/kernel/arch/arm64/boot/dts/rockchip/rk3568-atk-evb1-mipi-dsi-1080p.dts'''
          display_guarded = '''ifneq ($(wildcard sdk/kernel/arch/arm64/boot/dts/rockchip/rk3568-atk-evb1-mipi-dsi-1080p.dts),)
\tgrep -q 'default-brightness-level = <0>' sdk/kernel/arch/arm64/boot/dts/rockchip/rk3568-atk-evb1-mipi-dsi-1080p.dts
\t! grep -qE '&(dsi1|dsi1_panel|backlight1)[[:space:]]*\\{[[:space:]]*status = "disabled"' sdk/kernel/arch/arm64/boot/dts/rockchip/rk3568-atk-evb1-mipi-dsi-1080p.dts
else
\t@printf '%s\\n' 'SKIP: SDK display static checks (SDK tree is not present)'
endif'''
          if display_sdk in text:
              text = text.replace(display_sdk, display_guarded, 1)

          gst_sdk = '''\tgrep -q 'GST_VIDEO_COLOR_RANGE_0_255' sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c
\tgrep -q 'MPP_FRAME_RANGE_JPEG' sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c
\tgrep -q 'mpp_enc_cfg_set_s32 (self->mpp_cfg, "prep:range", range)' sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c
\tgrep -q 'failed to set input color range' sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c
\tgrep -q 'self->prop_dirty = TRUE' sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c'''
          gst_guarded = '''ifneq ($(wildcard sdk/external/gstreamer-rockchip/gst/rockchipmpp/gstmppenc.c),)
''' + gst_sdk + '''
else
\t@printf '%s\\n' 'SKIP: SDK GStreamer static checks (SDK tree is not present)'
endif'''
          if gst_sdk in text:
              text = text.replace(gst_sdk, gst_guarded, 1)

          sdk_block_start = '\tsh -n sdk/buildroot/board/rockchip/hyz_things/post-build.sh\n'
          sdk_block_end = '\ttest "$$(grep -cE \'revision="[0-9a-f]{40}"\' sdk/.repo/manifests/hyz-things-release.xml)" -eq 20\n'
          guard_marker = "SKIP: SDK Buildroot/kernel/manifest static checks"
          if guard_marker not in text:
              start = text.find(sdk_block_start)
              if start == -1:
                  raise SystemExit("SDK static block start not found")
              end_start = text.find(sdk_block_end, start)
              if end_start == -1:
                  raise SystemExit("SDK static block end not found")
              end = end_start + len(sdk_block_end)
              block = text[start:end]
              guarded = (
                  'ifneq ($(wildcard sdk/buildroot/board/rockchip/hyz_things/post-build.sh),)\n'
                  + block
                  + 'else\n'
                  + "\t@printf '%s\\\\n' 'SKIP: SDK Buildroot/kernel/manifest static checks (SDK tree is not present)'\n"
                  + 'endif\n'
              )
              text = text[:start] + guarded + text[end:]

          path.write_text(text)
          PY
      - name: Format changed Rust
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
      - name: Check generated WASM frontend
        run: cargo check --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web --target wasm32-unknown-unknown
      - name: Show diff summary
        run: |
          git diff --check
          git diff --stat
      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile apps/rust/things/src/web apps/rust/things/tools/web-refactor*.py
          git commit -m "ci: guard unavailable SDK-only static checks [web-refactor-generated]"
          git push origin HEAD:refactor/web-frontend-structure
