name: web refactor driver

on:
  push:
    branches:
      - refactor/web-frontend-structure
    paths:
      - "apps/rust/things/src/web/**"
      - "apps/rust/things/e2e/**"
      - "apps/rust/things/tools/web-refactor*.py"
      - ".github/workflows/web-refactor-driver.yml"

permissions:
  contents: write

concurrency:
  group: web-refactor-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[web-refactor-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-frontend-structure
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
      - name: Run pending refactor migrations
        run: |
          python3 apps/rust/things/tools/web-refactor-checkpoint.py
          python3 apps/rust/things/tools/web-refactor-static.py
          python3 apps/rust/things/tools/web-refactor-e2e.py
          python3 apps/rust/things/tools/web-refactor-components.py
          python3 apps/rust/things/tools/web-refactor-countdown-components.py
          python3 apps/rust/things/tools/web-refactor-shell-components.py
      - name: Format changed Rust
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
      - name: Check generated WASM frontend
        run: cargo check --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web --target wasm32-unknown-unknown
      - name: Show diff summary
        run: |
          git diff --check
          git diff --stat
      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile apps/rust/things/src/web apps/rust/things/e2e apps/rust/things/tools/web-refactor*.py
          git commit -m "refactor(web): extract shared presentation components [web-refactor-generated]"
          git push origin HEAD:refactor/web-frontend-structure
