name: Format comprehensive training draft
on:
  push:
    branches:
      - feat/study-data-analysis-comprehensive
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format Rust sources
        run: |
          cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rust/things/src
          if ! git diff --cached --quiet; then
            git commit -m "chore(study): rustfmt comprehensive training"
            git push
          fi
