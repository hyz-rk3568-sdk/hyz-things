name: Router CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/rust/router/**"
      - "apps/rust/contract/**"
      - "tools/stage-mihomo-geodata.sh"
      - "product/rootfs-overlay/**"
      - "Makefile"
      - ".github/workflows/router-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/rust/router/**"
      - "apps/rust/contract/**"
      - "tools/stage-mihomo-geodata.sh"
      - "product/rootfs-overlay/**"
      - "Makefile"
      - ".github/workflows/router-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Run source and configuration checks
        run: make check-static

  router:
    name: Router fmt/test/clippy
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/router/target
          key: ${{ runner.os }}-router-1.88-${{ hashFiles('apps/rust/router/Cargo.lock', 'apps/rust/contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-router-1.88-

      - name: Check formatting
        run: cargo fmt --manifest-path apps/rust/router/Cargo.toml --all -- --check

      - name: Test
        run: cargo test --locked --manifest-path apps/rust/router/Cargo.toml --all-features

      - name: Clippy
        run: cargo clippy --locked --manifest-path apps/rust/router/Cargo.toml --all-targets --all-features -- -D warnings
