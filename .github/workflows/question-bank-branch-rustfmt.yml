name: Question Bank Branch Rustfmt
on:
  push:
    branches:
      - feat/question-bank-practice-20261102

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/question-bank-practice-20261102
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Format changed Rust workspace
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
      - name: Commit formatting only to feature branch
        run: |
          git add apps/rust/things apps/rust/contract
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(question-bank): apply cargo fmt to feature branch"
            git push origin HEAD:feat/question-bank-practice-20261102
          fi
