name: hyz-things CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "apps/rust/router/**"
      - "apps/rust/camera/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/hyz-things-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "apps/rust/router/**"
      - "apps/rust/camera/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/hyz-things-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyz-things-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  static:
    name: Static + unit + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Validate capability Playwright suite layout
        run: python3 apps/rust/things/tools/check-e2e-suites.py

      # check-static reports explicit SKIP lines for SDK-only assertions when
      # the external SDK tree is not present in the ordinary GitHub checkout.
      - name: Run source and configuration checks
        run: make check-static

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-rust-1.88-trunk-0.21.14-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.88-trunk-0.21.14-
            ${{ runner.os }}-rust-1.88-

      - name: Check contract formatting
        run: cargo fmt --manifest-path apps/rust/contract/Cargo.toml --all -- --check

      - name: Test contract
        run: cargo test --locked --manifest-path apps/rust/contract/Cargo.toml

      - name: Clippy contract
        run: cargo clippy --locked --manifest-path apps/rust/contract/Cargo.toml --all-targets -- -D warnings

      - name: Install frontend dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Install Trunk 0.21.14
        shell: bash
        run: |
          if ! command -v trunk >/dev/null 2>&1 || [[ "$(trunk --version)" != "trunk 0.21.14" ]]; then
            cargo install trunk --version 0.21.14 --locked
          fi
          trunk --version

      - name: Build deterministic frontend bundle
        run: bash apps/rust/things/tools/build-frontend-bundle.sh

      - name: Check hyz-things formatting
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all -- --check

      # Keep browser-side pure logic covered by an executable unit-test target.
      # This specifically protects deterministic countdown/date/storage helpers
      # without depending on wall clock, DOM, browser storage, or Playwright.
      - name: Test hyz-things web unit logic
        run: cargo test --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web

      - name: Test hyz-things native
        run: cargo test --locked --manifest-path apps/rust/things/Cargo.toml --features native

      - name: Clippy hyz-things
        run: cargo clippy --locked --manifest-path apps/rust/things/Cargo.toml --all-targets --features e2e -- -D warnings

      - name: Upload verified frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle/hyz-things-frontend.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: Playwright E2E
    # Browser tests only start after source/config, formatting, unit, clippy,
    # and deterministic frontend bundle verification are all green.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-rust-1.88-trunk-0.21.14-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.88-trunk-0.21.14-
            ${{ runner.os }}-rust-1.88-

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/rust/things
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: apps/rust/things
        env:
          HYZ_THINGS_E2E_REUSE_FRONTEND_BUNDLE: "1"
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-playwright-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/rust/things/playwright-report/
            apps/rust/things/test-results/
