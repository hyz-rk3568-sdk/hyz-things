name: Prepare study draft dependencies
on:
  push:
    branches:
      - feat/study-data-analysis-comprehensive
permissions:
  contents: write
jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Resolve lock and apply rustfmt
        run: |
          cargo metadata --manifest-path apps/rust/things/Cargo.toml --format-version 1 > /dev/null
          cargo fmt --manifest-path apps/rust/things/Cargo.toml --all
      - name: Record deterministic dependency and format output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rust/things/Cargo.lock apps/rust/things/src apps/rust/things/Cargo.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore(study): update locked dependencies and rustfmt"
            git push origin HEAD:feat/study-data-analysis-comprehensive
          fi
