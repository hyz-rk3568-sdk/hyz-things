name: Portal CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "Makefile"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "Makefile"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Validate capability Playwright suite layout
        run: python3 apps/rust/things/tools/check-e2e-suites.py

      - name: Run source and configuration checks
        run: make check-static

  contract:
    name: Contract fmt/test/clippy
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
          key: ${{ runner.os }}-contract-1.88-${{ hashFiles('apps/rust/contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-1.88-
            ${{ runner.os }}-rust-1.88-

      - name: Check formatting
        run: cargo fmt --manifest-path apps/rust/contract/Cargo.toml --all -- --check

      - name: Test
        run: cargo test --locked --manifest-path apps/rust/contract/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path apps/rust/contract/Cargo.toml --all-targets -- -D warnings

  things-native:
    name: Things native fmt/test/clippy
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-native-1.88-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-native-1.88-
            ${{ runner.os }}-rust-1.88-

      - name: Check formatting
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all -- --check

      - name: Test native
        run: cargo test --locked --manifest-path apps/rust/things/Cargo.toml --features native

      - name: Clippy
        run: cargo clippy --locked --manifest-path apps/rust/things/Cargo.toml --all-targets --features e2e -- -D warnings

  frontend:
    name: Frontend build + web unit
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Cache Cargo and Trunk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-web-1.88-trunk-0.21.14-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-web-1.88-trunk-0.21.14-
            ${{ runner.os }}-rust-1.88-

      - name: Install frontend dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Install Trunk 0.21.14
        shell: bash
        run: |
          if ! command -v trunk >/dev/null 2>&1 || [[ "$(trunk --version)" != "trunk 0.21.14" ]]; then
            cargo install trunk --version 0.21.14 --locked
          fi
          trunk --version

      - name: Build deterministic frontend bundle
        run: bash apps/rust/things/tools/build-frontend-bundle.sh

      - name: Test web unit logic
        run: cargo test --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web

      - name: Upload verified frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle/hyz-things-frontend.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: Playwright E2E
    needs:
      - contract
      - things-native
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-e2e-1.88-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-e2e-1.88-
            ${{ runner.os }}-rust-1.88-

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/rust/things
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: apps/rust/things
        env:
          HYZ_THINGS_E2E_REUSE_FRONTEND_BUNDLE: "1"
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-playwright-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/rust/things/playwright-report/
            apps/rust/things/test-results/
