name: Portal CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "Makefile"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/rust/things/**"
      - "apps/rust/contract/**"
      - "Makefile"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: Verified frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Cache Cargo and Trunk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-web-1.88-trunk-0.21.14-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-web-1.88-trunk-0.21.14-
            ${{ runner.os }}-rust-1.88-

      - name: Install Trunk 0.21.14
        shell: bash
        run: |
          if ! command -v trunk >/dev/null 2>&1 || [[ "$(trunk --version)" != "trunk 0.21.14" ]]; then
            cargo install trunk --version 0.21.14 --locked
          fi
          trunk --version

      - name: Fingerprint frontend inputs and toolchain
        id: frontend_inputs
        shell: bash
        run: |
          inputs="$(python3 apps/rust/things/tools/frontend-bundle-cache.py fingerprint)"
          tools="$(python3 apps/rust/things/tools/frontend-bundle-cache.py toolchain)"
          printf 'sha=%s\ntools=%s\n' "$inputs" "$tools" >> "$GITHUB_OUTPUT"

      - name: Cache verified frontend bundle
        uses: actions/cache@v4
        with:
          path: target/frontend-bundle
          key: ${{ runner.os }}-frontend-bundle-v1-${{ steps.frontend_inputs.outputs.sha }}-${{ steps.frontend_inputs.outputs.tools }}

      - name: Validate cached frontend bundle
        id: frontend_cache
        shell: bash
        env:
          INPUT_FINGERPRINT: ${{ steps.frontend_inputs.outputs.sha }}
          TOOLCHAIN_FINGERPRINT: ${{ steps.frontend_inputs.outputs.tools }}
        run: |
          if python3 apps/rust/things/tools/frontend-bundle-cache.py check "$INPUT_FINGERPRINT" "$TOOLCHAIN_FINGERPRINT"; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        if: steps.frontend_cache.outputs.hit != 'true'
        working-directory: apps/rust/things
        run: npm ci

      - name: Install WASM target
        if: steps.frontend_cache.outputs.hit != 'true'
        run: rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Build deterministic frontend bundle
        if: steps.frontend_cache.outputs.hit != 'true'
        run: bash apps/rust/things/tools/build-frontend-bundle.sh

      - name: Upload verified frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: |
            target/frontend-bundle/hyz-things-frontend.tar
            target/frontend-bundle/hyz-things-frontend.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  preflight:
    name: Fast format and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.88 with rustfmt
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Check committed diff
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Validate capability Playwright suite layout
        if: ${{ !cancelled() }}
        run: python3 apps/rust/things/tools/check-e2e-suites.py

      - name: Run source and configuration checks
        if: ${{ !cancelled() }}
        run: make check-static

      - name: Check contract formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path apps/rust/contract/Cargo.toml --all -- --check

      - name: Check things formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path apps/rust/things/Cargo.toml --all -- --check


  checks:
    name: Format, static, unit tests and Clippy
    needs: frontend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.88
        id: rust
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-checks-1.88-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-checks-1.88-
            ${{ runner.os }}-things-native-1.88-
            ${{ runner.os }}-rust-1.88-

      - name: Download verified frontend bundle
        if: ${{ !cancelled() && needs.frontend.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle

      - name: Validate downloaded frontend bundle
        if: ${{ !cancelled() && needs.frontend.result == 'success' }}
        run: python3 apps/rust/things/tools/frontend-bundle-cache.py check

      - name: Test contract
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked --manifest-path apps/rust/contract/Cargo.toml

      - name: Test web unit logic
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked --manifest-path apps/rust/things/Cargo.toml --no-default-features --features web --bin hyz-things-web

      - name: Clippy contract
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path apps/rust/contract/Cargo.toml --all-targets -- -D warnings

      - name: Clippy native
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path apps/rust/things/Cargo.toml --all-targets --features e2e -- -D warnings

      - name: Test native
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        # All native tests are required. Async AI fakes must bound waits so
        # regressions fail with a named assertion instead of exhausting the job.
        run: timeout --signal=TERM --kill-after=5s 12m cargo test --locked --manifest-path apps/rust/things/Cargo.toml --features native -- --nocapture


  e2e-plan:
    name: Count related E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      shards: ${{ steps.scope.outputs.shards }}
      total: ${{ steps.scope.outputs.total }}
      test_count: ${{ steps.scope.outputs.test_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Install test dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Select related specs and count runnable tests
        id: scope
        working-directory: apps/rust/things
        shell: bash
        env:
          FORCE_COLOR: "0"
        run: |
          selected="$(bash tools/select-related-e2e.sh)"
          specs=()
          if [[ -n "$selected" ]]; then
            mapfile -t specs <<< "$selected"
          fi
          listing="$(./node_modules/.bin/playwright test "${specs[@]}" --list)"
          printf '%s\n' "$listing"
          count="$(printf '%s\n' "$listing" | python3 -c 'import re,sys; value=sys.stdin.read(); match=re.search(r"Total:\s*(\d+)\s+tests?\b",value); sys.exit("Cannot parse Playwright test count") if match is None else None; print(match.group(1))')"
          if (( count < 1 )); then
            echo "error: zero runnable E2E tests selected" >&2
            exit 1
          fi
          if (( count <= 20 )); then
            total=1
          elif (( count <= 40 )); then
            total=2
          elif (( count <= 80 )); then
            total=4
          else
            total=8
          fi
          shards="[$(seq -s, 1 "$total")]"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "test_count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count runnable E2E tests; using $total runner(s)"

  e2e:
    name: Playwright E2E (shard ${{ matrix.shard }}/${{ needs.e2e-plan.outputs.total }})
    needs: [frontend, e2e-plan]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: hyz-things-frontend-${{ github.run_id }}
          path: target/frontend-bundle

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust/contract/target
            apps/rust/things/target
          key: ${{ runner.os }}-things-e2e-1.88-${{ hashFiles('apps/rust/contract/Cargo.lock', 'apps/rust/things/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-things-e2e-1.88-
            ${{ runner.os }}-things-checks-1.88-
            ${{ runner.os }}-rust-1.88-

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/rust/things/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/rust/things
        run: npm ci

      - name: Install Playwright WebKit
        working-directory: apps/rust/things
        run: npx playwright install --with-deps webkit

      - name: Run Playwright E2E
        working-directory: apps/rust/things
        shell: bash
        env:
          HYZ_THINGS_E2E_REUSE_FRONTEND_BUNDLE: "1"
          HYZ_THINGS_E2E_TEST_SHARD: "1"
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARD_TOTAL: ${{ needs.e2e-plan.outputs.total }}
        run: |
          selected="$(bash tools/select-related-e2e.sh)"
          specs=()
          if [[ -n "$selected" ]]; then
            mapfile -t specs <<< "$selected"
          fi
          echo "E2E shard ${E2E_SHARD}/${E2E_SHARD_TOTAL} with ${#specs[@]} explicit spec filters (zero means all)"
          npm run test:e2e -- "${specs[@]}" --shard="${E2E_SHARD}/${E2E_SHARD_TOTAL}"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hyz-things-playwright-failure-${{ github.run_id }}-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/rust/things/playwright-report/
            apps/rust/things/test-results/

  e2e-summary:
    # Keep the historical required-check name while matrix jobs run independently.
    name: Playwright E2E
    if: ${{ always() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all selected E2E shards
        run: test '${{ needs.e2e.result }}' = 'success'
