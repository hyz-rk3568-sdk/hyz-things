# DHCP and DNS proxy for the isolated br-lan LAN.
interface=br-lan
bind-interfaces
listen-address=192.168.8.1
except-interface=lo
domain-needed
bogus-priv
dhcp-authoritative
dhcp-range=192.168.8.100,192.168.8.249,255.255.255.0,10m
dhcp-option=3,192.168.8.1
dhcp-option=6,192.168.8.1
dhcp-leasefile=/run/hyz-router/dnsmasq.leases
