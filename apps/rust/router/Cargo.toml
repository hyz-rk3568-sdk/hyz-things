[package]
name = "hyz-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
default = ["native"]
native = [
  "dep:async-trait",
  "dep:libc",
  "dep:serde_json",
  "dep:sha2",
  "dep:socket2",
  "dep:tokio",
  "dep:ureq",
]

[dependencies]
hyz-contract = { path = "../contract", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.33"
sha1 = "0.10"
zeroize = "1.9.0"

async-trait = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }
socket2 = { version = "0.6", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "hyz-router"
path = "src/main.rs"
required-features = ["native"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
