[package]
name = "hyz-things"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
build = "build.rs"

[features]
default = ["native"]
e2e = ["native"]
native = [
  "dep:argon2",
  "dep:async-trait",
  "dep:axum",
  "dep:getrandom",
  "dep:libc",
  "dep:mime_guess",
  "dep:serde_json",
  "dep:sha2",
  "dep:socket2",
  "dep:tar",
  "dep:tokio",
]
web = [
  "dep:gloo-net",
  "dep:gloo-timers",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:yew",
]

[dependencies]
hyz-contract = { path = "../contract", features = ["client"] }
serde = { version = "1", features = ["derive"] }
url = "2.5.8"
zeroize = "1.9.0"

argon2 = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
getrandom = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
mime_guess = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }
socket2 = { version = "0.6", optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }

gloo-net = { version = "0.6", features = ["json"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlMediaElement",
  "HtmlSelectElement",
  "HtmlVideoElement",
  "MediaStream",
  "MediaStreamTrack",
  "RequestCredentials",
  "RtcIceGatheringState",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcRtpTransceiver",
  "RtcRtpTransceiverDirection",
  "RtcRtpTransceiverInit",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcTrackEvent",
  "Window",
], optional = true }
yew = { version = "0.21", features = ["csr"], optional = true }

[build-dependencies]
tar = "0.4"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "hyz-things"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "hyz-things-web"
path = "src/web/main.rs"
required-features = ["web"]

[[bin]]
name = "hyz-things-e2e"
path = "src/e2e/main.rs"
required-features = ["e2e"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
